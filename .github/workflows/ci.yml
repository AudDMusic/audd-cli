name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...

  build:
    name: Cross-build (CGO disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/audd
            echo "built $target"
          done

  packaging:
    name: Release packaging (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom
      - name: install.sh against the snapshot
        run: go test -count=1 -v -run TestInstallSnapshot ./scripts/
      - name: Package script tests
        run: |
          node --test scripts/npm-pack.test.mjs
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: npm packages install and run
        run: |
          node scripts/npm-pack.mjs
          v=$(node -p "require('./dist/metadata.json').version")
          mkdir -p "$RUNNER_TEMP/npm" && cd "$RUNNER_TEMP/npm"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dist/npm/audd-cli-linux-x64-$v.tgz" "$GITHUB_WORKSPACE/dist/npm/audd-cli-$v.tgz"
          npx audd version
      - name: Wheels install and run
        run: |
          python scripts/build_wheels.py
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index --find-links dist/pypi audd-cli
          "$RUNNER_TEMP/venv/bin/audd" version

  msi:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build audd.exe and the installers
        run: |
          $env:CGO_ENABLED = '0'
          foreach ($arch in 'amd64', 'arm64') {
            $env:GOARCH = $arch
            go build -trimpath -o "build\$arch\audd.exe" ./cmd/audd
            if ($LASTEXITCODE -ne 0) { throw "go build $arch failed" }
          }
          Remove-Item Env:GOARCH
          pwsh scripts/build-msi.ps1 build\amd64\audd.exe amd64 0.0.1 out\audd-0.0.1-amd64.msi
          if ($LASTEXITCODE -ne 0) { throw 'build-msi.ps1 failed' }
          pwsh scripts/build-msi.ps1 build\amd64\audd.exe amd64 0.0.2 out\audd-0.0.2-amd64.msi
          if ($LASTEXITCODE -ne 0) { throw 'build-msi.ps1 failed' }
          pwsh scripts/build-msi.ps1 build\arm64\audd.exe arm64 0.0.2 out\audd-0.0.2-arm64.msi
          if ($LASTEXITCODE -ne 0) { throw 'build-msi.ps1 failed' }
      - name: The installer has its finish page
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @((Resolve-Path out\audd-0.0.2-amd64.msi).Path, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'WIXUI_EXITDIALOGOPTIONALTEXT'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          if ($null -eq $rec) { throw 'the finish page text is missing' }
          $text = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
          if ($text -notlike '*AudD CLI is installed*') { throw "unexpected finish text: $text" }
          "finish page: $text"
      - name: Install, upgrade, and uninstall
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\AudD CLI'
          $exe = Join-Path $dir 'audd.exe'
          function UserPath { [Environment]::GetEnvironmentVariable('PATH', 'User') }
          function Msi($msiArgs) {
            $p = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content msi.log -ErrorAction SilentlyContinue | Select-Object -Last 60; throw "msiexec $msiArgs exited $($p.ExitCode)" }
          }
          # Installed AudD CLI versions, by the installer's UpgradeCode.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          function Get-MsiProperty($name, $arguments) { $installer.GetType().InvokeMember($name, 'GetProperty', $null, $installer, $arguments) }
          function Versions { @(Get-MsiProperty RelatedProducts @('{C62DFFE9-5DE7-4511-9A24-091D8B9685A8}') | ForEach-Object { Get-MsiProperty ProductInfo @([string]$_, 'VersionString') }) }

          Msi "/i out\audd-0.0.1-amd64.msi /qn /l*v msi.log"
          if (-not (Test-Path $exe)) { throw "audd.exe was not installed at $exe" }
          if ((UserPath) -notlike "*$dir*") { throw "the user PATH does not include $dir`: $(UserPath)" }
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw 'audd version failed' }
          # A new shell finds audd through the user PATH.
          $env:PATH = "$([Environment]::GetEnvironmentVariable('PATH', 'Machine'));$(UserPath)"
          (Get-Command audd).Source
          if ("$(Versions)" -ne '0.0.1') { throw "expected AudD CLI 0.0.1 to be installed, found: $(Versions)" }

          Msi "/i out\audd-0.0.2-amd64.msi /qn /l*v msi.log"
          if ("$(Versions)" -ne '0.0.2') { throw "expected only AudD CLI 0.0.2 after the upgrade, found: $(Versions)" }
          $count = ((UserPath) -split ';' | Where-Object { $_.TrimEnd('\') -eq $dir.TrimEnd('\') }).Count
          if ($count -ne 1) { throw "the user PATH has $count entries for $dir after the upgrade" }

          Msi "/x out\audd-0.0.2-amd64.msi /qn /l*v msi.log"
          if (Test-Path $exe) { throw 'audd.exe is still there after uninstalling' }
          if ((UserPath) -like "*$dir*") { throw "the user PATH still includes $dir after uninstalling" }
          if ((Versions).Count -ne 0) { throw "AudD CLI is still installed after uninstalling: $(Versions)" }
          'install, upgrade, and uninstall: ok'
